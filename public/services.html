<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services - Nexora</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .services-hero { text-align: center; padding: 100px 40px 60px; }
    .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; padding: 0 40px 80px; }
    .service-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 35px 30px; transition: all 0.3s ease; position: relative; overflow: hidden; }
    .service-card:hover { border-color: rgba(0,200,255,0.3); transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .service-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; margin-bottom: 24px; }
    .service-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #fff; }
    .service-card p { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.7; margin-bottom: 20px; }
    .service-features { list-style: none; padding: 0; margin: 0; }
    .service-features li { color: rgba(255,255,255,0.5); font-size: 13px; padding: 6px 0; display: flex; align-items: center; gap: 10px; }
    .service-features li::before { content: '✓'; color: #00c8ff; font-weight: 700; }
    .service-badge { position: absolute; top: 20px; right: 20px; background: rgba(0,200,255,0.2); color: #00c8ff; padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
    .service-price { margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.08); color: #00c8ff; font-weight: 700; font-size: 16px; }
    .loading { text-align: center; padding: 60px; color: rgba(255,255,255,0.5); grid-column: 1 / -1; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #00c8ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <svg class="logo-svg" width="36" height="36" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGradServices" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#0066ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0033aa;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path d="M 15 85 L 15 15 L 30 15 L 65 65 L 65 15 L 85 15 L 85 85 L 70 85 L 35 35 L 35 85 Z" 
              fill="url(#logoGradServices)" stroke="#00d4ff" stroke-width="1"/>
      </svg>
      <span class="name">Nexora</span>
    </a>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="services.html" class="active">Services</a>
      <a href="pricing.html">Pricing</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="team.html">Team</a>
      <a href="reviews.html">Reviews</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="navbar-actions">
      <a href="contact.html" class="btn-quote">🚀 Get a Quote</a>
      <button class="btn-whatsapp" id="whatsappDropdownBtn">💬 WhatsApp ▾</button>
      <a href="admin-login.html" class="btn-admin">🔒 Admin</a>
    </div>
  </nav>

  <section class="services-hero">
    <span class="section-badge">OUR SERVICES</span>
    <h1 class="section-title">What We <span style="background:linear-gradient(135deg,#ff006e,#00c8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Build</span></h1>
    <p class="section-subtitle">Enterprise-grade solutions tailored for scale, performance, and security.</p>
  </section>

  <div class="services-grid" id="servicesGrid">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading services...</p>
    </div>
  </div>

  <footer class="footer">
    <p>© 2024 Nexora. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    // Load services from API
    async function loadPublicServices() {
      const grid = document.getElementById('servicesGrid');

      try {
        const data = (typeof fetchServicesData === 'function') ? await fetchServicesData() : await fetch('/api/services').then(r => r.json());
        const services = data.data || data.services || [];

        if (data.success && services.length > 0) {
          const iconMap = {
            code: { emoji: '💻', bg: 'rgba(0,200,255,0.12)', color: '#00c8ff' },
            mobile: { emoji: '📱', bg: 'rgba(123,47,255,0.12)', color: '#7b2fff' },
            brain: { emoji: '🧠', bg: 'rgba(255,0,110,0.12)', color: '#ff006e' },
            cloud: { emoji: '☁️', bg: 'rgba(0,230,118,0.12)', color: '#00e676' },
            shield: { emoji: '🔒', bg: 'rgba(255,107,0,0.12)', color: '#ff6b00' },
            palette: { emoji: '🎨', bg: 'rgba(224,64,251,0.12)', color: '#e040fb' }
          };

          grid.innerHTML = services.map(function(service) {
            const iconKey = service.icon || 'code';
            const iconData = iconMap[iconKey] || iconMap.code;
            const features = Array.isArray(service.features) ? service.features : (typeof service.features === 'string' ? service.features.split(',').map(function(f) { return f.trim(); }).filter(Boolean) : []);
            const badge = service.badge || service.category || '';
            const price = service.price || '';
            
            var featuresHtml = '';
            if (features.length > 0) {
              featuresHtml = '<ul class="service-features">' + features.map(function(f) { return '<li>' + f + '</li>'; }).join('') + '</ul>';
            }

            var badgeHtml = badge ? '<div class="service-badge">' + badge + '</div>' : '';
            var priceHtml = price ? '<div class="service-price">' + (price.includes('PKR') ? price : price + ' PKR') + '</div>' : '';

            var visualHtml = service.image ? (
              '<div class="service-cover-img" style="width:100%; height:160px; border-radius:12px; overflow:hidden; margin-bottom:16px;">' +
                '<img src="' + service.image + '" alt="' + service.title + '" style="width:100%; height:100%; object-fit:cover; display:block;" onerror="this.parentElement.style.display=\'none\'" />' +
              '</div>'
            ) : (
              '<div class="service-icon" style="background: ' + iconData.bg + '; color: ' + iconData.color + ';">' +
                iconData.emoji +
              '</div>'
            );

            return '<div class="service-card">' +
              badgeHtml +
              visualHtml +
              '<h3>' + service.title + '</h3>' +
              '<p>' + service.description + '</p>' +
              featuresHtml +
              priceHtml +
            '</div>';
          }).join('');
        } else {
          grid.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.5); padding: 40px; grid-column: 1 / -1;">No services available yet.</p>';
        }
      } catch (error) {
        console.error('Error loading services:', error);
        grid.innerHTML = '<p style="text-align: center; color: #ff4444; padding: 40px; grid-column: 1 / -1;">Failed to load services.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadPublicServices);
  </script>
</body>
</html>
